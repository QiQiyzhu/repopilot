[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "An evidence-first coding agent harness and evaluation platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "PyYAML>=6.0,<7", "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6.0"]

[project.scripts]
repopilot = "repopilot.cli:main"
repopilot-mcp = "repopilot.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/repopilot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
