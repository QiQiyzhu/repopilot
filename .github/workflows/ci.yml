name: Evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - run: ruff check backend scripts
      - run: mypy backend/repopilot
      - run: pytest -q
      - run: repopilot demo --transport mcp --output outputs/ci-mcp-trace.json
      - run: npm ci --prefix evaluation --ignore-scripts
      - name: Checkout the pinned evaluation target
        run: git clone https://github.com/QiQiyzhu/arc-shift.git /tmp/arc-shift
      - run: python -m repopilot.evaluation validate-contracts /tmp/arc-shift --output outputs/contracts.json
      - run: python -m repopilot.evaluation ablate-fixture --output outputs/ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: outputs/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r ../requirements.lock && pip install --no-deps -e ..
      - run: npx playwright install --with-deps chromium
      - name: Real-backend browser workflows
        working-directory: .
        run: |
          mkdir -p outputs
          repopilot serve > outputs/ci-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            outputs/browser-results.json
            outputs/ci-api.log
            frontend/test-results/
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the deployable images
        run: docker compose --project-name repopilot-ci build
      - name: Start containers and verify the published application
        run: |
          mkdir -p outputs/container
          cleanup() {
            docker compose --project-name repopilot-ci ps --all --format json > outputs/container/compose-status.json 2>&1 || true
            docker compose --project-name repopilot-ci logs --no-color --timestamps > outputs/container/compose.log 2>&1 || true
            docker compose --project-name repopilot-ci down --volumes --remove-orphans > outputs/container/cleanup.log 2>&1
          }
          trap cleanup EXIT
          docker compose --project-name repopilot-ci up --detach --wait --wait-timeout 100 > outputs/container/startup.log 2>&1
          python scripts/container_smoke.py
          docker compose --project-name repopilot-ci restart backend > outputs/container/restart.log 2>&1
          python scripts/container_smoke.py --resume
      - name: Cleanup if the preceding shell was interrupted
        if: always()
        run: docker compose --project-name repopilot-ci down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-runtime-evidence
          path: outputs/container/
